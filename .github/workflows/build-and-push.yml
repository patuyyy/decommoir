name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPO: decommoir

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud (OIDC)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/1043410105970/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
        service_account: "github-ci@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

    # =========================
    # Backend Image
    # =========================
    - name: Build Backend Image
      run: |
        docker build \
          -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/backend:latest \
          ./backend

    - name: Push Backend Image
      run: |
        docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/backend:latest

    # =========================
    # Frontend Image
    # =========================
    - name: Build Frontend Image
      run: |
        docker build \
          -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/frontend:latest \
          ./frontend

    - name: Push Frontend Image
      run: |
        docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/frontend:latest
